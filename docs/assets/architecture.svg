<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img" aria-labelledby="title desc">
<title id="title">StarVLA-RSI：Agent、Benchmark Runner 与原生 Benchmark 代码</title>
<desc id="desc">统一 CLI 选择 benchmark 服务。左侧 Agent 拥有决策循环；右侧服务内部横向展开为 Benchmark Runner 服务适配层和原生 Benchmark 代码。两块表示职责，不代表额外进程。交互报告在控制路径之外，哈希与完整性审计是内部支撑。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#536681"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17283e}
    .h{font-size:27px;font-weight:700}.b{font-size:22px}.s{font-size:19px;fill:#536681}
    .tag{font-size:16px;font-weight:600;letter-spacing:1px;fill:#536681}
    .m{font-family:Menlo,Consolas,monospace;font-size:18px}
    .w{fill:none;stroke:#536681;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1800" height="1140" fill="#f5f7fb"/>
<rect x="50" y="42" width="6" height="78" rx="3" fill="#177d91"/>
<text x="78" y="66" class="s">STARVLA-RSI / BENCHMARK SERVICES FOR AGENTIC POLICIES</text>
<text x="78" y="111" font-size="37" font-weight="700">一个服务入口，各自的机器人能力；看清每次交互与结果</text>
<text x="78" y="148" class="s">RoboDojo 是实例，不是全部框架。统一通信，不统一动作空间；策略不接触仿真神谕信息。</text>

<rect x="730" y="190" width="1020" height="112" rx="16" fill="#edf4ff" stroke="#9bbce2"/>
<text x="755" y="228" class="h">统一启动入口 · 选择后委托</text>
<text x="755" y="266" class="m">rsi-bench serve --benchmark &lt;id&gt; ...</text>
<text x="1270" y="231" class="s">13 个开发态服务路由</text>
<text x="1270" y="268" class="s">不代表环境已安装或原生完整验收</text>
<path class="w" d="M970 302V340"/>

<rect x="50" y="340" width="470" height="430" rx="18" fill="white" stroke="#9bbce2" stroke-width="2"/>
<text x="78" y="377" class="tag">AGENT-OWNED</text>
<text x="78" y="415" class="h">Agent / 受信任 driver</text>
<text x="78" y="453" class="m">AgentPolicies/&lt;agent&gt;/</text>
<rect x="78" y="478" width="414" height="158" rx="12" fill="#edf4ff"/>
<text x="99" y="516" class="b">提示词、记忆、规划与动作决策</text>
<text x="99" y="553" class="s">只接收声明的观测与执行反馈</text>
<text x="99" y="586" class="s">driver 持有凭据，不交给模型 Actor</text>
<text x="99" y="619" class="s">模型决策循环归 agent</text>
<text x="78" y="685" class="s">自选策略约束 / 主动停止 / 模型配置</text>
<text x="78" y="727" class="m">policy_support/runner.py</text>

<rect x="730" y="340" width="1020" height="430" rx="18" fill="#fffaf1" stroke="#d7b277" stroke-width="2"/>
<text x="755" y="379" class="h">所选 Benchmark Server · 同一服务边界内展开两部分</text>
<text x="755" y="413" class="m">benchmarks/simBenchmarks/&lt;benchmark&gt;/</text>

<rect x="755" y="438" width="430" height="284" rx="14" fill="white" stroke="#d7b277"/>
<text x="778" y="469" class="tag">BENCHMARK-OWNED SERVICE / ADAPTER</text>
<text x="778" y="506" class="h">Benchmark Runner</text>
<text x="778" y="538" class="s">基准侧服务与适配层 · 不做模型决策</text>
<text x="778" y="573" class="m">server.py · bench_server/</text>
<text x="778" y="612" class="s">固定计划、会话与一次性 episode claim</text>
<text x="778" y="645" class="s">观测白名单、动作契约与原生接口映射</text>
<text x="778" y="678" class="s">返回公开观测 / ACK，收集原生结果</text>
<text x="778" y="708" class="s" style="font-size:17px">Runner 是职责标签，不是新增中央执行进程</text>

<rect x="1345" y="438" width="380" height="284" rx="14" fill="#f0f7f6" stroke="#9bbeb2"/>
<text x="1368" y="469" class="tag">UPSTREAM / NATIVE IMPLEMENTATION</text>
<text x="1368" y="506" class="h" style="font-size:25px">原生 Benchmark 代码</text>
<text x="1368" y="538" class="s">environment/ → 上游原始实现</text>
<text x="1368" y="576" class="s">任务、场景与机器人</text>
<text x="1368" y="611" class="s">物理 / 渲染 / 原生低层控制器</text>
<text x="1368" y="646" class="s">原生终止 / horizon / success</text>
<text x="1368" y="681" class="s">对象真值与隐藏评分留在服务内部</text>
<text x="1368" y="708" class="s" style="font-size:17px">固定上游版本；私有 worker 按需使用</text>

<path class="w" d="M1185 572H1345"/>
<text x="1265" y="552" class="s" text-anchor="middle" style="font-size:17px">原生 API 调用</text>
<path class="w" d="M1345 643H1185"/>
<text x="1265" y="674" class="s" text-anchor="middle" style="font-size:17px">原生观测 / 结果</text>
<text x="755" y="752" class="s" style="font-size:18px">RoboDojo · SimplerEnv · LIBERO · SIMPLE · …　各自保留单位、坐标系、预算与原生评分</text>

<path class="w" d="M520 520H730"/>
<text x="625" y="500" class="s" text-anchor="middle">给定动作</text>
<path class="w" d="M730 597H520"/>
<text x="625" y="631" class="s" text-anchor="middle">声明的观测 / ACK</text>
<text x="625" y="683" class="s" text-anchor="middle">共享通信库</text>
<text x="625" y="712" class="m" text-anchor="middle" style="font-size:17px">benchkit/sim_server</text>

<path class="w" stroke-dasharray="6 5" d="M285 770V824"/>
<path class="w" stroke-dasharray="6 5" d="M1240 770V824"/>
<rect x="50" y="826" width="1700" height="172" rx="18" fill="white" stroke="#9bbeb2" stroke-width="2"/>
<text x="78" y="866" class="h">用户主视图：交互历史与任务结果</text>
<text x="78" y="903" class="b">策略调用输入 → 已记录输出 → 提交动作 / 确认执行 → 反馈、计数与停止结果</text>
<text x="78" y="940" class="m">benchkit/reports/ → AgentPolicies/&lt;agent&gt;/results/&lt;benchmark&gt;/</text>
<text x="78" y="978" class="s">首版为闭合记录 HTML / JSON：不复制媒体，不补造缺失输出，不证明 provider 实际消费了输入。</text>
<text x="50" y="1046" class="s">内部支撑：源码冻结、内容指纹与完整性审计保留；公开复现依据可含已记录的上游版本、环境和资产来源。</text>
<text x="50" y="1086" class="s">图中是职责组件，不要求额外进程。真实机器人统一服务仍待验证；目录和服务分离不等于 OS 安全隔离。</text>
</svg>
